name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lanjie
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lanjie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Init schema
        run: mysql -h 127.0.0.1 -uroot -proot lanjie < sql/schema.sql
      - name: Test
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - name: Build mobile
        working-directory: frontend-mobile
        run: |
          npm ci
          npm run build
      - name: Build PC
        working-directory: frontend-pc
        run: |
          npm ci
          npm run build
